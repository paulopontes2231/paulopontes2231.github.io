<div class="coat">
  <app-header></app-header>
  <div class="big">
    <div class="container">
      <div class="col" style="padding-top: 50px; padding-left: 0px;">
        <label class="button label" style="margin-right: 10px;">IMPORT PLAYER FILE
          <input type="file" (change)="onImportFile($event)" #fileInput accept=".csv" />
        </label>
        <!--       <button class="button" style="margin-right: 10px;">IMPORT PLAYER</button>-->

        <button class="button" (click)="openInstructions()">INSTRUCTIONS</button>
      </div>
      <input class="filter" (keyup)="applyFilter($any($event.target).value)" placeholder="Filter">

      <div class="table-container"
        >
        <mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8" style="width: 100%; table-layout: fixed;">

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Name </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
          </ng-container>

          <!-- Club Column -->
          <ng-container matColumnDef="club">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Club </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.club}} </mat-cell>
          </ng-container>

          <!-- Age Column -->
          <ng-container matColumnDef="age">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Age </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.age}} </mat-cell>
          </ng-container>

          <!-- Price Column -->
          <ng-container matColumnDef="price">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Price </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.price}} </mat-cell>
          </ng-container>

          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Position </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.position}} </mat-cell>
          </ng-container>

          <!-- Best Rating Column -->
          <ng-container matColumnDef="bestRating">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Best Rating </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.bestRating}} </mat-cell>
          </ng-container>

          <!-- Total Attributes Column -->
          <ng-container matColumnDef="totalAttributes">
            <mat-header-cell *matHeaderCellDef mat-sort-header> Total Attributes </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{getTotalAttributes(element)}} </mat-cell>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> <!-- Actions --> </mat-header-cell>
            <mat-cell *matCellDef="let element">
              <button class="detailButton" (click)="openDetails(element)">Details</button>
            </mat-cell>
          </ng-container>

          <!-- Header and Row Declarations -->
          <mat-header-row *matHeaderRowDef="displayedColumns"
            style="background-color: #14242E; color: white; text-align: center;"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;" style="text-align: center;"></mat-row>
        </mat-table>

        <mat-paginator [pageSizeOptions]="[5]" showFirstLastButtons></mat-paginator>
      </div>

    </div>
  </div>
  <div class="footer">
    <h5 class="title">Follow me on social media</h5>
    <a href="https://linkedin.com/in/paulo-pontes2231" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="icon"
        viewBox="0 0 16 16">
        <path
          d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854V1.146zm4.943 12.248V6.169H2.542v7.225h2.401zm-1.2-8.212c.837 0 1.358-.554 1.358-1.248-.015-.709-.52-1.248-1.342-1.248-.822 0-1.359.54-1.359 1.248 0 .694.521 1.248 1.327 1.248h.016zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.865h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016a5.54 5.54 0 0 1 .016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225h2.4z" />
      </svg>
    </a>
    <p class="text"> Developed by Paulo Pontes. Built with Angular</p>
  </div>
</div>
