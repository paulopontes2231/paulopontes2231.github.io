<div class="levels-desktop" *ngIf="isDesktop">
    <div class="level" *ngFor="let level of levels.reverse()">
        <span class="value"
            [ngClass]="{'level-active': level.active, 'level-inactive': !level.active}">{{level.value}}€</span>
    </div>
</div>

<!-- Mobile layout (< 650px): show one icon + count -->
<div class="levels-mobile" *ngIf="!isDesktop">
    <span class="level value level-active">{{
        levels[findLastActive()].value }}€</span>
</div>
