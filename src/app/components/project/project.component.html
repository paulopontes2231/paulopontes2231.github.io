<div class="cartolina">
    <div class="img">
        <img class="image" [ngClass]="{ 'small-image': project.title =='Joker'}"  src="{{project.image}}">
    </div>
    <h6 class="cardtitle">{{project.title}}</h6>
    <div class="carddescription">{{project.description}}</div>

    <a href="{{project.path}}">
        <button class="button" *ngIf="project.showButton === true">
            Demo
        </button>
    </a>
</div>
